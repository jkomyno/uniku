packages:
  - 'apps/*'
  - 'examples'
  - 'packages/*'
  - 'packages/uniku/__tests__/e2e/runtimes/cloudflare'

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  msgpackr-extract: false
  sharp: false
  workerd: true

catalog:
  typescript: ^6.0.3
  vitest: ^5.1.0
  "@vitest/coverage-v8": ^5.1.0
  wrangler: ^4.107.0
  "@cloudflare/vitest-pool-workers": ^0.18.0
  "@cloudflare/workers-types": ^5.20260706.1
  hono: ^4.12.28

catalogs:
  # The Cloudflare e2e workspace cannot run on Vitest 5 yet: every
  # @cloudflare/vitest-pool-workers release (through 0.23.0) requires Vitest 4
  # and its pool fails to start on 5.
  vitest4:
    vitest: ^4.1.10
