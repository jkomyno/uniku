packages:
  - 'apps/*'
  - 'examples'
  - 'packages/*'
  - 'packages/uniku/__tests__/e2e/runtimes/cloudflare'

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  msgpackr-extract: false
  sharp: false
  workerd: true

catalog:
  typescript: ^6.0.3
  vitest: ^5.1.0
  wrangler: ^4.107.0
  "@cloudflare/vitest-pool-workers": ^0.18.0
  "@cloudflare/workers-types": ^5.20260706.1
  hono: ^4.12.28

catalogs:
  # Workspaces that cannot run on Vitest 5 yet:
  # - the Cloudflare e2e: every @cloudflare/vitest-pool-workers release
  #   (through 0.23.0) requires Vitest 4 and its pool fails to start on 5;
  # - packages/uniku: its benchmarks use the `bench()` API Vitest 5 removed.
  vitest4:
    "@vitest/coverage-v8": ^4.1.10
    vitest: ^4.1.10
