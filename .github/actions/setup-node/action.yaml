name: 'Setup Node.js'
description: 'Setup Node.js and pnpm with caching'

outputs:
  node-version:
    description: 'Default Node.js version from mise.toml'
    value: ${{ steps.runtime-versions.outputs.node-version }}
  node-compat-version:
    description: 'Minimum compatible Node.js version from mise.toml'
    value: ${{ steps.runtime-versions.outputs.node-compat-version }}
  bun-test-version:
    description: 'Bun test channel from mise.toml'
    value: ${{ steps.runtime-versions.outputs.bun-test-version }}
  deno-version:
    description: 'Deno version from mise.toml'
    value: ${{ steps.runtime-versions.outputs.deno-version }}

runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

    - name: Setup Turbo cache
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Resolve runtime versions
      id: runtime-versions
      shell: bash
      run: |
        read_mise_value() {
          local section="$1"
          local key="$2"

          awk -v expected_section="[$section]" -v expected_key="$key" '
            $0 == expected_section { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && $1 == expected_key && $2 == "=" {
              gsub(/^"|"$/, "", $3)
              print $3
              exit
            }
          ' mise.toml
        }

        node_version="$(read_mise_value tools node)"
        node_compat_version="$(read_mise_value vars node_compat)"
        bun_test_version="$(read_mise_value vars bun_test)"
        deno_version="$(read_mise_value tools deno)"

        if [[ -z "$node_version" || -z "$node_compat_version" || -z "$bun_test_version" || -z "$deno_version" ]]; then
          echo "::error::Could not resolve all runtime versions from mise.toml"
          exit 1
        fi

        echo "node-version=$node_version" >> "$GITHUB_OUTPUT"
        echo "node-compat-version=$node_compat_version" >> "$GITHUB_OUTPUT"
        echo "bun-test-version=$bun_test_version" >> "$GITHUB_OUTPUT"
        echo "deno-version=$deno_version" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
        node-version: ${{ steps.runtime-versions.outputs.node-version }}
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
