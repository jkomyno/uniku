name: 'Setup Bun'
description: 'Setup the Bun version pinned in mise.toml'

runs:
  using: 'composite'
  steps:
    - name: Resolve Bun version
      id: bun-version
      shell: bash
      run: |
        bun_version="$(awk '
          $0 == "[tools]" { in_tools = 1; next }
          /^\[/ { in_tools = 0 }
          in_tools && $1 == "bun" && $2 == "=" {
            gsub(/^"|"$/, "", $3)
            print $3
            exit
          }
        ' mise.toml)"

        if [[ -z "$bun_version" ]]; then
          echo "::error::Could not resolve the Bun version from mise.toml"
          exit 1
        fi

        echo "bun-version=$bun_version" >> "$GITHUB_OUTPUT"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.bun-version.outputs.bun-version }}
