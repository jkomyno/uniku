name: Docs

on:
  push:
    branches:
      - main
    paths: &docs-paths
      - "apps/docs/**"
      - "docs/**"
      - "examples/**"
      - ".github/actions/setup-bun/action.yaml"
      - ".github/workflows/docs.yaml"
      - "mise.toml"
      - "packages/uniku/src/**"
      - "README.md"
      - "packages/cli/README.md"
      - "packages/uniku/README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    # `closed` is required so the preview job can tear down a PR's preview
    # when it's merged or closed without a final push - it is not part of
    # `pull_request`'s default type set (opened, synchronize, reopened).
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths: *docs-paths
  workflow_dispatch:

concurrency:
  # A merged PR emits both a push to main and pull_request.closed. Group PR
  # runs by number so preview cleanup cannot cancel the production deployment.
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    # Nothing to typecheck/build when a PR is merely being closed - the
    # preview job tears down its own deployment independently of this job.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck docs and snippets
        run: pnpm docs:typecheck

      - name: Run integrated examples
        run: pnpm examples:check

      - name: Build static site
        run: pnpm docs:build

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build static site
        run: pnpm docs:build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: apps/docs/dist/client
          branch: gh-pages
          # Preserve concurrently deployed PR previews living under pr-preview/.
          clean-exclude: pr-preview
          force: false

  preview:
    name: Deploy PR preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: ./.github/actions/setup-node

      - name: Build static site
        # No build needed when the PR is closed: the preview action only
        # removes the existing deployment in that case.
        if: github.event.action != 'closed'
        env:
          DOCS_BASE_PATH: /uniku/pr-preview/pr-${{ github.event.number }}/
        run: pnpm docs:build

      - name: Stamp preview build
        if: github.event.action != 'closed'
        run: printf '%s\n' "$GITHUB_SHA" > apps/docs/dist/client/preview-build.txt

      - name: Deploy preview
        if: github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: apps/docs/dist/client
          branch: gh-pages
          target-folder: pr-preview/pr-${{ github.event.number }}
          commit-message: Deploy preview for PR ${{ github.event.number }}
          force: false

      - name: Wait for preview deployment
        if: github.event.action != 'closed'
        env:
          PREVIEW_MARKER_URL: https://jkomyno.github.io/uniku/pr-preview/pr-${{ github.event.number }}/preview-build.txt
        run: |
          for (( attempt = 1; attempt <= 90; attempt++ )); do
            deployed_sha="$(curl --fail --silent "$PREVIEW_MARKER_URL?run=$GITHUB_RUN_ID" || true)"
            if [[ "$deployed_sha" == "$GITHUB_SHA" ]]; then
              exit 0
            fi
            sleep 5
          done

          echo "::error::Timed out waiting for the PR preview to deploy"
          exit 1

      - name: Comment with preview URL
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@447031a6bb83f7438d890bb0136932be78342022 # v3.0.0
        with:
          header: pr-preview
          message: |
            :rocket: View the docs preview at https://jkomyno.github.io/uniku/pr-preview/pr-${{ github.event.number }}/

            <sub>Built by workflow run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).</sub>

      - name: Prepare empty preview directory
        if: github.event.action == 'closed'
        run: mkdir -p "$RUNNER_TEMP/empty-preview"

      - name: Remove preview
        if: github.event.action == 'closed'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: ${{ runner.temp }}/empty-preview
          branch: gh-pages
          target-folder: pr-preview/pr-${{ github.event.number }}
          commit-message: Remove preview for PR ${{ github.event.number }}
          force: false

      - name: Wait for preview removal
        if: github.event.action == 'closed'
        env:
          PREVIEW_MARKER_URL: https://jkomyno.github.io/uniku/pr-preview/pr-${{ github.event.number }}/preview-build.txt
        run: |
          for (( attempt = 1; attempt <= 90; attempt++ )); do
            status_code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$PREVIEW_MARKER_URL?run=$GITHUB_RUN_ID" || true)"
            if [[ "$status_code" == "404" ]]; then
              exit 0
            fi
            sleep 5
          done

          echo "::error::Timed out waiting for the PR preview to be removed"
          exit 1

      - name: Comment after preview removal
        if: github.event.action == 'closed'
        uses: marocchino/sticky-pull-request-comment@447031a6bb83f7438d890bb0136932be78342022 # v3.0.0
        with:
          header: pr-preview
          message: Preview removed because the pull request was closed.
