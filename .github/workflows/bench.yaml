name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "packages/uniku/src/**"
      - "packages/uniku/__tests__/bench/**"
      - "packages/uniku/scripts/bench-*"
      - "packages/uniku/scripts/bundle-*"
      - "packages/uniku/scripts/cold-start-*"
      - "packages/uniku/scripts/entrypoints.*"
      - "packages/uniku/package.json"
      - "packages/uniku/tsdown.config.ts"
      - "packages/uniku/vitest.config.ts"
      - "tsdown.config.base.ts"
      - "vitest.config.base.ts"
      # The competitor table also measures the reference packages' versions.
      - "pnpm-lock.yaml"
      - ".github/workflows/bench.yaml"
  pull_request:
    paths:
      - "packages/uniku/src/**"
      - "packages/uniku/__tests__/bench/**"
      - "packages/uniku/scripts/bench-*"
      - "packages/uniku/scripts/bundle-*"
      - "packages/uniku/scripts/cold-start-*"
      - "packages/uniku/scripts/entrypoints.*"
      - "packages/uniku/package.json"
      - "packages/uniku/tsdown.config.ts"
      - "packages/uniku/vitest.config.ts"
      - "tsdown.config.base.ts"
      - "vitest.config.base.ts"
      - ".github/workflows/bench.yaml"
  schedule:
    # Weekly competitor run, so reference package releases show up without a uniku change.
    - cron: "23 5 * * 1"
  workflow_dispatch:

# PR runs and competitor runs never share a group. A new PR push cancels the
# previous A/B run; competitor runs queue so a baseline update is not cut off.
concurrency:
  group: bench-${{ github.event_name == 'pull_request' && 'ab' || 'competitors' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ab:
    name: Benchmark vs Merge Base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_BRANCH_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # The merge base needs full history

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Check out merge base
        run: |
          merge_base="$(git merge-base "$HEAD_SHA" "$BASE_BRANCH_SHA")"
          base_dir="$RUNNER_TEMP/bench-base"
          git worktree add --detach "$base_dir" "$merge_base"
          {
            echo "MERGE_BASE=$merge_base"
            echo "BASE_DIR=$base_dir"
          } >> "$GITHUB_ENV"

      # Only the root tooling and uniku's own dependencies; the pnpm store is already warm.
      - name: Install merge base dependencies
        run: pnpm install --frozen-lockfile --filter uniku
        working-directory: ${{ env.BASE_DIR }}

      - name: Build head
        run: pnpm --filter uniku build

      - name: Build merge base
        run: pnpm --filter uniku build
        working-directory: ${{ env.BASE_DIR }}

      - name: Run A/B benchmarks
        run: bun scripts/bench-ab.ts "$BASE_DIR/packages/uniku" "$RUNNER_TEMP/bench-ab"
        working-directory: packages/uniku

      - name: Compare benchmarks
        id: compare
        working-directory: packages/uniku
        run: |
          set +e
          OUTPUT=$(CI=true bun scripts/bench-compare.ts "$RUNNER_TEMP/bench-ab/base.json" "$RUNNER_TEMP/bench-ab/head.json" 2>&1)
          EXIT_CODE=$?
          set -e

          printf '%s\n' "$OUTPUT" > "$RUNNER_TEMP/bench-comparison.md"

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "has_regression=true" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "has_regression=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$OUTPUT"
            exit "$EXIT_CODE"
          fi

      - name: Compare bundle sizes
        working-directory: packages/uniku
        run: |
          set -o pipefail
          bun scripts/bundle-summary.ts --root "$BASE_DIR/packages/uniku" --json "$RUNNER_TEMP/bundle-base.json"
          CI=true bun scripts/bundle-summary.ts --baseline "$RUNNER_TEMP/bundle-base.json" | tee "$RUNNER_TEMP/bundle-summary.md"

      - name: Measure cold starts
        working-directory: packages/uniku
        run: |
          set -o pipefail
          pnpm bench:cold-start | tee "$RUNNER_TEMP/cold-start.md"

      - name: Create PR comment artifact
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          comment="$RUNNER_TEMP/benchmark-pr-comment.md"
          {
            echo "<!-- benchmark-results -->"
            echo "## Benchmark vs Merge Base"
            echo
            echo "Head \`${HEAD_SHA:0:7}\` against merge base \`${MERGE_BASE:0:7}\` on the same runner. Each side ran uniku's rows of compat.bench.ts four times in alternating order, and the table compares per-row medians. Cold starts are measured on the head build only."
            echo
            cat "$RUNNER_TEMP/bench-comparison.md"
            echo
            cat "$RUNNER_TEMP/bundle-summary.md"
            echo
            cat "$RUNNER_TEMP/cold-start.md"
            echo
            echo "<sub>Generated by workflow run [$RUN_ID]($RUN_URL)</sub>"
          } > "$comment"
          cat "$comment" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR comment artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-pr-comment
          path: ${{ runner.temp }}/benchmark-pr-comment.md
          retention-days: 7

      # Report regressions without failing PRs. Shared-runner benchmark variance can
      # exceed the threshold for rows unrelated to the current change.
      - name: Report benchmark regressions
        if: steps.compare.outputs.has_regression == 'true'
        run: |
          echo "::warning::Performance regression detected; see PR comment for details."

  competitors:
    name: Competitor Benchmarks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0 # Need full history for branch operations

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build
        run: pnpm --filter uniku build

      - name: Run benchmarks
        run: |
          mkdir -p "$RUNNER_TEMP/bench-runs"
          orders=(uniku-first reference-first uniku-first reference-first)
          for iteration in "${!orders[@]}"; do
            UNIKU_BENCH_ORDER="${orders[$iteration]}" pnpm bench:compat
            run_number=$((iteration + 1))
            cp bench-results.json "$RUNNER_TEMP/bench-runs/$run_number.json"
          done
          bun scripts/bench-aggregate.ts bench-results.json "$RUNNER_TEMP"/bench-runs/*.json
        working-directory: packages/uniku

      - name: Publish benchmark summary
        run: |
          set -o pipefail
          CI=true bun scripts/bench-summary.ts | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: packages/uniku

      - name: Update baseline
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-benchmarks:gh-benchmarks 2>/dev/null || true
          git show gh-benchmarks:baseline.json > "$RUNNER_TEMP/benchmark-baseline.json" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/benchmark-baseline.json"
          bun packages/uniku/scripts/bench-history.ts "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/benchmark-baseline.json" packages/uniku/bench-results.json

          # Switch to gh-benchmarks branch (create orphan if doesn't exist)
          if git show-ref --verify --quiet refs/heads/gh-benchmarks; then
            git checkout gh-benchmarks
          else
            git checkout --orphan gh-benchmarks
            git rm -rf . 2>/dev/null || true
          fi

          # Copy the rolling action-level aggregate and commit.
          cp "$RUNNER_TEMP/baseline.json" baseline.json
          git add baseline.json
          git commit -m "Update benchmark baseline from ${{ github.sha }}" --allow-empty

          # Force push to gh-benchmarks
          git push origin gh-benchmarks --force

          # Keep local actions available for their post-job cleanup hooks.
          git checkout "$GITHUB_SHA"
